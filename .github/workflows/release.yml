name: Release

# Manual only — do not tag v1 on every main push.
# This workflow is the only pusher of orphan release/v1 and floating tag v1.
# Never tag v1 at main. Never git checkout release/v1.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Require main
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            printf 'refusing to publish from %s; checkout current main SHA only (never checkout release/v1)\n' "${GITHUB_REF}" >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "${GITHUB_SHA}" ]]; then
            printf 'HEAD %s is not github.sha %s\n' "$(git rev-parse HEAD)" "${GITHUB_SHA}" >&2
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Publish local orphan tree
        run: bash scripts/publish-action-tree.sh

      - name: Push release/v1 and floating v1
        run: |
          set -euo pipefail

          orphan_sha="$(git rev-parse --verify refs/heads/release/v1)"
          main_sha="${GITHUB_SHA}"

          printf 'orphan release/v1 %s (main %s)\n' "${orphan_sha}" "${main_sha}"

          if [[ "${orphan_sha}" == "${main_sha}" ]]; then
            printf 'refusing to tag v1 at main SHA %s\n' "${main_sha}" >&2
            exit 1
          fi

          git fetch origin refs/heads/release/v1:refs/remotes/origin/release/v1 || true

          if git rev-parse --verify --quiet refs/remotes/origin/release/v1 >/dev/null; then
            git push --force-with-lease=refs/heads/release/v1:"$(git rev-parse refs/remotes/origin/release/v1)" \
              origin refs/heads/release/v1:refs/heads/release/v1
          else
            git push --force-with-lease=refs/heads/release/v1: \
              origin refs/heads/release/v1:refs/heads/release/v1
          fi

          # Floating @v1 MUST point at the orphan commit only.
          # Never: git tag v1 "$GITHUB_SHA"
          git tag --force v1 "${orphan_sha}"

          tag_sha="$(git rev-parse --verify refs/tags/v1)"
          if [[ "${tag_sha}" == "${main_sha}" ]]; then
            printf 'refusing to push v1 at main SHA %s\n' "${main_sha}" >&2
            exit 1
          fi
          if [[ "${tag_sha}" != "${orphan_sha}" ]]; then
            printf 'v1 points at %s, not orphan %s\n' "${tag_sha}" "${orphan_sha}" >&2
            exit 1
          fi

          git push --force origin refs/tags/v1:refs/tags/v1
