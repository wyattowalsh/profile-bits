version: 1
format: svg
theme: dark
output_pair: false
animated: false
timezone: UTC
output_dir: profile-bits
plugins:
  github:
    widgets:
      demo: {}
      repo:
        filename: repo
        repo: wyattowalsh/profile-bits
        include: [stars, forks, issues, license]
        avatar: true
        animate: false
  http:
    widgets:
      chips:
        filename: chips
        preset: shieldcn
        types: [stars, forks, license]
        repo: wyattowalsh/profile-bits
        workflow: ci.yml
  rss:
    widgets:
      feed:
        filename: feed
        url: https://github.com/wyattowalsh/profile-bits/releases.atom
