# Dependabot v2 — weekly updates for the pnpm workspace and GitHub Actions.
# `package-ecosystem: npm` at `/` covers package.json + pnpm-lock.yaml.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
