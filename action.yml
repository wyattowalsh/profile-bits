# Generated by `pnpm generate-action`. Do not edit by hand.
name: Profile Bits widgets
description: "Generate GitHub profile widgets from committed yaml."
branding:
  icon: layout
  color: blue
inputs:
  user:
    description: "GitHub login to render widgets for. Defaults to the repository owner."
    default: ${{ github.repository_owner }}
  github_token:
    description: "GitHub token for API requests. Omitted uses the workflow token. Empty or whitespace fails the job."
    default: ${{ github.token }}
  committer_token:
    description: "GitHub token for git commit, pull-request, and gist output. Defaults to the workflow token."
    default: ${{ github.token }}
  config:
    description: "Path to the profile-bits yaml config (SSOT for plugin and widget options)."
    default: .github/profile-bits.yml
  plugin_github:
    description: "Enable the github pack (stats, languages) only when the config file is absent. Ignored when the config file exists."
  wakatime_token:
    description: "WakaTime API key. Required when the wakatime pack is enabled. Empty or whitespace fails the job."
  http_token_env:
    description: "Name of the environment variable holding an optional HTTP Bearer token. Unset sends no Authorization."
  format:
    description: "Optional output format override (svg, png, jpeg, webp, ico, gif, apng)."
  theme:
    description: "Optional named theme id override. theme: custom as an Action input fails."
  output_pair:
    description: "Optional override to write both filename and filename-dark."
  animated:
    description: "Optional override for animated output."
  output_action:
    description: "How to publish widget files (none, commit, pull-request, gist). gist is SVG only."
    default: commit
  committer_branch:
    description: "Branch to commit widget files to. Defaults to the current branch."
  committer_gist:
    description: "Gist id to update when output_action is gist."
  output_condition:
    description: "When to publish output (always or data-changed)."
  timezone:
    description: "Optional timezone override (IANA name, for example UTC)."
  dry_run:
    description: "Render widgets without committing, opening a pull request, or updating a gist."
  allow_skipped:
    description: "When true, the job may succeed if every github widget is skipped."
    default: false
runs:
  using: node24
  main: dist/index.js
